<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>User - vscode</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
	<main class="container py-5">
		<h2 class="mb-4">User endpoint</h2>

		<section class="card mb-3 p-3">
			<h3 class="h5">GET (쿼리)</h3>
			<form id="getForm" action="/user" method="get" class="d-flex gap-2">
				<input name="name" type="text" class="form-control" placeholder="name" />
				<button class="btn btn-primary" type="submit">Send GET</button>
			</form>
			<div id="getResult" class="result mt-2"></div>
		</section>

		<section class="card mb-3 p-3">
			<h3 class="h5">POST (form)</h3>
			<form id="postForm" method="post" action="/user" enctype="application/x-www-form-urlencoded" class="d-flex gap-2">
				<input name="name" type="text" class="form-control" placeholder="name" />
				<button class="btn btn-success" type="submit">Send POST (AJAX)</button>
			</form>
			<div id="postResult" class="result mt-2"></div>
		</section>

		<p><a href="/hello.html" class="btn btn-link">Back</a></p>
	</main>
	<script src="/js/app.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
