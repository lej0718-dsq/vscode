<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>오류가 발생했습니다</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f8f9fa; color:#212529; }
    .card { max-width:720px; margin:6vh auto; padding:2rem; }
  </style>
</head>
<body>
  <div class="card shadow-sm">
    <h1 class="h3 text-danger mb-2">문제가 발생했습니다</h1>
    <p class="mb-3">요청을 처리하는 중에 오류가 발생했습니다. 페이지를 새로고침하거나 아래 버튼으로 홈으로 이동하세요.</p>
    <div class="d-flex gap-2">
      <button onclick="location.reload()" class="btn btn-outline-primary">다시 시도</button>
      <a href="/hello.html" class="btn btn-primary">홈으로 이동</a>
    </div>
    <hr />
    <small class="text-muted">문제가 반복되면 개발자에게 로그를 전달해 주세요.</small>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
